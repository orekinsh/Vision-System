<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>HyperVerge World Clock - Spacious</title>
    <style>
        :root {
            --primary-blue: #3B82F6;
            --primary-blue-dark: #2563EB;
            --primary-blue-light: #60A5FA;

            /* Light mode */
            --bg-primary: #F5F5F7;
            --bg-widget: #FFFFFF;
            --bg-widget-blur: rgba(255, 255, 255, 0.72);
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --text-tertiary: #C7C7CC;
            --border-color: rgba(0, 0, 0, 0.06);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.1);

            /* Status colors */
            --work-hours: #34C759;
            --after-hours: #FF9500;
            --night-time: #5856D6;
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-widget: #1C1C1E;
            --bg-widget-blur: rgba(28, 28, 30, 0.72);
            --text-primary: #FFFFFF;
            --text-secondary: #98989D;
            --text-tertiary: #48484A;
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 12px 32px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 24px 20px;
            transition: background 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding: 0 4px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -0.8px;
            color: var(--text-primary);
        }

        .theme-toggle {
            width: 48px;
            height: 48px;
            border-radius: 24px;
            background: var(--bg-widget);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-toggle svg {
            width: 22px;
            height: 22px;
            color: var(--text-primary);
        }

        .widget-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 900px;
            margin: 0 auto;
        }

        .office-card {
            background: var(--bg-widget);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .office-card:active {
            transform: scale(0.98);
        }

        .weather-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            opacity: 0.6;
        }

        .flag {
            font-size: 36px;
            line-height: 1;
            margin-bottom: 12px;
        }

        .city-name {
            font-size: 20px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.4px;
            margin-bottom: 4px;
        }

        .country-name {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 20px;
        }

        .time-display {
            font-size: 48px;
            font-weight: 200;
            color: var(--text-primary);
            letter-spacing: -1.5px;
            font-variant-numeric: tabular-nums;
            margin-bottom: 10px;
            line-height: 1;
        }

        .date-info {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
            letter-spacing: -0.2px;
            margin-bottom: 12px;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .status-badge.work-hours {
            background: var(--work-hours);
            color: white;
        }

        .status-badge.after-hours {
            background: var(--after-hours);
            color: white;
        }

        .status-badge.night {
            background: var(--night-time);
            color: white;
        }

        .footer {
            text-align: center;
            margin-top: 32px;
            padding: 20px;
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 500;
        }

        @media (max-width: 600px) {
            .widget-container {
                grid-template-columns: 1fr;
            }

            .time-display {
                font-size: 40px;
            }
        }

        @media (min-width: 768px) {
            body {
                padding: 32px;
            }

            .header h1 {
                font-size: 36px;
            }

            .widget-container {
                gap: 24px;
            }

            .office-card {
                padding: 28px;
            }

            .time-display {
                font-size: 52px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>World Clock</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" stroke-width="2"/>
                <path stroke-linecap="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="moon-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
        </button>
    </div>

    <div class="widget-container" id="widgetContainer"></div>

    <div class="footer">
        Updates every minute
    </div>

    <script>
        const offices = [
            { name: "India", city: "Bangalore", timezone: "Asia/Kolkata", flag: "🇮🇳", weather: "⛅" },
            { name: "Vietnam", city: "Ho Chi Minh", timezone: "Asia/Ho_Chi_Minh", flag: "🇻🇳", weather: "☀️" },
            { name: "Philippines", city: "Manila", timezone: "Asia/Manila", flag: "🇵🇭", weather: "☁️" },
            { name: "Singapore", city: "Singapore", timezone: "Asia/Singapore", flag: "🇸🇬", weather: "🌧️" },
            { name: "Indonesia", city: "Jakarta", timezone: "Asia/Jakarta", flag: "🇮🇩", weather: "⛅" },
            { name: "Kenya", city: "Nairobi", timezone: "Africa/Nairobi", flag: "🇰🇪", weather: "☀️" },
            { name: "South Africa", city: "Johannesburg", timezone: "Africa/Johannesburg", flag: "🇿🇦", weather: "🌤️" },
            { name: "USA", city: "New York", timezone: "America/New_York", flag: "🇺🇸", weather: "☁️" },
            { name: "USA", city: "South Dakota", timezone: "America/Denver", flag: "🇺🇸", weather: "☀️" },
            { name: "USA", city: "San Francisco", timezone: "America/Los_Angeles", flag: "🇺🇸", weather: "🌫️" }
        ];

        function getWorkStatus(hour) {
            if (hour >= 9 && hour < 18) {
                return { text: "Work", class: "work-hours" };
            } else if (hour >= 18 && hour < 22) {
                return { text: "After", class: "after-hours" };
            } else {
                return { text: "Night", class: "night" };
            }
        }

        function createOfficeCard(office) {
            return `
                <div class="office-card">
                    <span class="weather-icon">${office.weather}</span>
                    <div class="flag">${office.flag}</div>
                    <div class="city-name">${office.city}</div>
                    <div class="country-name">${office.name}</div>
                    <div class="time-display" data-timezone="${office.timezone}">--:--</div>
                    <div class="date-info" data-timezone="${office.timezone}">Loading...</div>
                    <span class="status-badge" data-timezone="${office.timezone}">...</span>
                </div>
            `;
        }

        function updateClocks() {
            const now = new Date();

            offices.forEach(office => {
                // Time without seconds
                const timeStr = now.toLocaleTimeString('en-US', {
                    timeZone: office.timezone,
                    hour12: true,
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const dateStr = now.toLocaleDateString('en-US', {
                    timeZone: office.timezone,
                    weekday: 'long',
                    month: 'long',
                    day: 'numeric'
                });

                const hour = parseInt(now.toLocaleTimeString('en-US', {
                    timeZone: office.timezone,
                    hour12: false,
                    hour: '2-digit'
                }));

                const status = getWorkStatus(hour);

                document.querySelectorAll(`.time-display[data-timezone="${office.timezone}"]`)
                    .forEach(el => el.textContent = timeStr);

                document.querySelectorAll(`.date-info[data-timezone="${office.timezone}"]`)
                    .forEach(el => el.textContent = dateStr);

                document.querySelectorAll(`.status-badge[data-timezone="${office.timezone}"]`)
                    .forEach(el => {
                        el.textContent = status.text;
                        el.className = `status-badge ${status.class}`;
                    });
            });
        }

        function initClocks() {
            const container = document.getElementById('widgetContainer');
            container.innerHTML = offices.map(office => createOfficeCard(office)).join('');
            updateClocks();
            setInterval(updateClocks, 60000); // Update every minute
        }

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', initClocks);
    </script>
</body>
</html>

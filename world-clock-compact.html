<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>HyperVerge World Clock</title>
    <style>
        :root {
            /* Light mode */
            --bg-primary: #F5F5F7;
            --bg-widget: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

            /* Time-based background tints (light mode) */
            --early-hours: rgba(173, 216, 230, 0.3); /* Light blue */
            --working-hours: rgba(255, 235, 59, 0.25); /* Yellow */
            --after-hours: rgba(25, 118, 210, 0.2); /* Dark blue */
            --night: rgba(0, 0, 0, 0.85); /* Black */
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-widget: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #98989D;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);

            /* Time-based background tints (dark mode) */
            --early-hours: rgba(173, 216, 230, 0.2);
            --working-hours: rgba(255, 235, 59, 0.15);
            --after-hours: rgba(25, 118, 210, 0.25);
            --night: rgba(0, 0, 0, 0.7);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 12px;
            transition: background 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: var(--bg-widget);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            color: var(--text-primary);
        }

        .widget-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .office-card {
            background: var(--bg-widget);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 0;
        }

        .office-card:active {
            transform: scale(0.97);
        }

        /* Time period backgrounds */
        .office-card.early-hours {
            background: var(--early-hours);
        }

        .office-card.working-hours {
            background: var(--working-hours);
        }

        .office-card.after-hours {
            background: var(--after-hours);
        }

        .office-card.night {
            background: var(--night);
        }

        .office-card.night .city-name,
        .office-card.night .time-display {
            color: #FFFFFF;
        }

        .location-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 8px;
        }

        .flag {
            font-size: 16px;
            line-height: 1;
        }

        .city-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.1px;
        }

        .time-display {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        @media (min-width: 600px) {
            body {
                padding: 16px;
            }

            .header {
                margin-bottom: 16px;
            }

            .header h1 {
                font-size: 28px;
            }

            .theme-toggle {
                width: 44px;
                height: 44px;
            }

            .theme-toggle svg {
                width: 20px;
                height: 20px;
            }

            .widget-container {
                gap: 12px;
            }

            .office-card {
                padding: 14px;
            }

            .time-display {
                font-size: 32px;
            }

            .city-name {
                font-size: 14px;
            }

            .flag {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>World Clock</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" stroke-width="2"/>
                <path stroke-linecap="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="moon-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
        </button>
    </div>

    <div class="widget-container" id="widgetContainer"></div>

    <script>
        // Ordered east from India (following the sun)
        const offices = [
            { city: "Bangalore", timezone: "Asia/Kolkata", flag: "🇮🇳" },        // UTC+5:30
            { city: "Ho Chi Minh", timezone: "Asia/Ho_Chi_Minh", flag: "🇻🇳" },  // UTC+7
            { city: "Jakarta", timezone: "Asia/Jakarta", flag: "🇮🇩" },          // UTC+7
            { city: "Singapore", timezone: "Asia/Singapore", flag: "🇸🇬" },      // UTC+8
            { city: "Manila", timezone: "Asia/Manila", flag: "🇵🇭" },            // UTC+8
            { city: "San Francisco", timezone: "America/Los_Angeles", flag: "🇺🇸" }, // UTC-8
            { city: "South Dakota", timezone: "America/Denver", flag: "🇺🇸" },   // UTC-7
            { city: "New York", timezone: "America/New_York", flag: "🇺🇸" },     // UTC-5
            { city: "Johannesburg", timezone: "Africa/Johannesburg", flag: "🇿🇦" }, // UTC+2
            { city: "Nairobi", timezone: "Africa/Nairobi", flag: "🇰🇪" }         // UTC+3
        ];

        function getTimePeriod(hour) {
            if (hour >= 6 && hour < 9) {
                return "early-hours"; // Light blue
            } else if (hour >= 9 && hour < 18) {
                return "working-hours"; // Yellow
            } else if (hour >= 18 && hour < 22) {
                return "after-hours"; // Dark blue
            } else {
                return "night"; // Black
            }
        }

        function createOfficeCard(office) {
            return `
                <div class="office-card" data-timezone="${office.timezone}">
                    <div class="location-header">
                        <span class="flag">${office.flag}</span>
                        <span class="city-name">${office.city}</span>
                    </div>
                    <div class="time-display" data-time="${office.timezone}">--:--</div>
                </div>
            `;
        }

        function updateClocks() {
            const now = new Date();

            offices.forEach(office => {
                // 24-hour format
                const timeStr = now.toLocaleTimeString('en-US', {
                    timeZone: office.timezone,
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const hour = parseInt(now.toLocaleTimeString('en-US', {
                    timeZone: office.timezone,
                    hour12: false,
                    hour: '2-digit'
                }));

                const period = getTimePeriod(hour);

                // Update time
                document.querySelectorAll(`[data-time="${office.timezone}"]`)
                    .forEach(el => el.textContent = timeStr);

                // Update card background
                document.querySelectorAll(`[data-timezone="${office.timezone}"]`)
                    .forEach(card => {
                        card.className = `office-card ${period}`;
                    });
            });
        }

        function initClocks() {
            const container = document.getElementById('widgetContainer');
            container.innerHTML = offices.map(office => createOfficeCard(office)).join('');
            updateClocks();
            setInterval(updateClocks, 60000);
        }

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', initClocks);
    </script>
</body>
</html>

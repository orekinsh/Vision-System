<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>HyperVerge World Clock</title>
    <style>
        :root {
            /* Light mode */
            --bg-primary: #F5F5F7;
            --bg-widget: #FFFFFF;
            --text-primary: #1D1D1F;
            --text-secondary: #86868B;
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);

            /* Time-based background tints - Minimalist Monochrome */
            --dawn: rgba(232, 232, 232, 0.6); /* Light gray */
            --morning: rgba(255, 255, 255, 0.8); /* White */
            --afternoon: rgba(245, 245, 220, 0.7); /* Light beige */
            --evening: rgba(192, 192, 192, 0.5); /* Medium gray */
            --dusk: rgba(105, 105, 105, 0.4); /* Dark gray */
            --night: rgba(44, 44, 44, 0.9); /* Near black */
        }

        [data-theme="dark"] {
            --bg-primary: #000000;
            --bg-widget: #1C1C1E;
            --text-primary: #FFFFFF;
            --text-secondary: #98989D;
            --border-color: rgba(255, 255, 255, 0.12);
            --shadow: 0 2px 8px rgba(0, 0, 0, 0.3);

            /* Time-based background tints - Minimalist Monochrome (dark mode) */
            --dawn: rgba(80, 80, 80, 0.5);
            --morning: rgba(100, 100, 100, 0.4);
            --afternoon: rgba(90, 90, 85, 0.45);
            --evening: rgba(70, 70, 70, 0.5);
            --dusk: rgba(50, 50, 50, 0.6);
            --night: rgba(20, 20, 20, 0.9);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', 'Segoe UI', sans-serif;
            background: var(--bg-primary);
            min-height: 100vh;
            padding: 12px;
            transition: background 0.3s ease;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 2px;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
            color: var(--text-primary);
        }

        .theme-toggle {
            width: 36px;
            height: 36px;
            border-radius: 18px;
            background: var(--bg-widget);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: var(--shadow);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            color: var(--text-primary);
        }

        .widget-container {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            max-width: 500px;
            margin: 0 auto;
        }

        .office-card {
            background: var(--bg-widget);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            min-height: 0;
        }

        .office-card:active {
            transform: scale(0.97);
        }

        /* Time period backgrounds - Minimalist Monochrome */
        .office-card.dawn {
            background: var(--dawn);
        }

        .office-card.morning {
            background: var(--morning);
        }

        .office-card.afternoon {
            background: var(--afternoon);
        }

        .office-card.evening {
            background: var(--evening);
        }

        .office-card.dusk {
            background: var(--dusk);
        }

        .office-card.night {
            background: var(--night);
        }

        .office-card.dusk .city-name,
        .office-card.dusk .time-display,
        .office-card.night .city-name,
        .office-card.night .time-display {
            color: #FFFFFF;
        }

        .location-header {
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 8px;
        }

        .flag {
            font-size: 16px;
            line-height: 1;
        }

        .city-name {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: -0.1px;
        }

        .time-display {
            font-size: 28px;
            font-weight: 300;
            color: var(--text-primary);
            letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        @media (min-width: 600px) {
            body {
                padding: 16px;
            }

            .header {
                margin-bottom: 16px;
            }

            .header h1 {
                font-size: 28px;
            }

            .theme-toggle {
                width: 44px;
                height: 44px;
            }

            .theme-toggle svg {
                width: 20px;
                height: 20px;
            }

            .widget-container {
                gap: 12px;
            }

            .office-card {
                padding: 14px;
            }

            .time-display {
                font-size: 32px;
            }

            .city-name {
                font-size: 14px;
            }

            .flag {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>World Clock</h1>
        <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
            <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="5" stroke-width="2"/>
                <path stroke-linecap="round" stroke-width="2" d="M12 1v2m0 18v2M4.22 4.22l1.42 1.42m12.72 12.72l1.42 1.42M1 12h2m18 0h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
            </svg>
            <svg class="moon-icon" style="display: none;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
            </svg>
        </button>
    </div>

    <div class="widget-container" id="widgetContainer"></div>

    <!-- Gradient Options Preview -->
    <div class="gradient-preview-section">
        <div class="gradient-title">Continuous Gradient Options</div>
        <div class="gradient-subtitle">Tap to preview on cards above</div>

        <div class="gradient-options">
            <div class="gradient-option" data-gradient="sky">
                <div class="gradient-swatch gradient-sky"></div>
                <div class="gradient-label">Sky Cycle</div>
                <div class="gradient-desc">Night → Dawn → Day → Sunset</div>
            </div>

            <div class="gradient-option" data-gradient="monochrome">
                <div class="gradient-swatch gradient-monochrome"></div>
                <div class="gradient-label">Monochrome</div>
                <div class="gradient-desc">Smooth grayscale flow</div>
            </div>

            <div class="gradient-option" data-gradient="warm-cool">
                <div class="gradient-swatch gradient-warm-cool"></div>
                <div class="gradient-label">Warm/Cool</div>
                <div class="gradient-desc">Warm day → Cool night</div>
            </div>

            <div class="gradient-option" data-gradient="subtle">
                <div class="gradient-swatch gradient-subtle"></div>
                <div class="gradient-label">Subtle Pro</div>
                <div class="gradient-desc">Minimal elegant tones</div>
            </div>

            <div class="gradient-option" data-gradient="ocean">
                <div class="gradient-swatch gradient-ocean"></div>
                <div class="gradient-label">Ocean Sunset</div>
                <div class="gradient-desc">Cool blue → Warm orange</div>
            </div>

            <div class="gradient-option" data-gradient="nordic">
                <div class="gradient-swatch gradient-nordic"></div>
                <div class="gradient-label">Nordic Minimal</div>
                <div class="gradient-desc">Pale muted gradient</div>
            </div>
        </div>
    </div>

    <style>
        .gradient-preview-section {
            max-width: 500px;
            margin: 24px auto 0;
            padding: 16px;
            background: var(--bg-widget);
            border-radius: 20px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
        }

        .gradient-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            text-align: center;
            margin-bottom: 4px;
        }

        .gradient-subtitle {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 16px;
        }

        .gradient-options {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .gradient-option {
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .gradient-option:active {
            transform: scale(0.97);
        }

        .gradient-swatch {
            height: 60px;
            border-radius: 12px;
            margin-bottom: 8px;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .gradient-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 2px;
        }

        .gradient-desc {
            font-size: 10px;
            color: var(--text-secondary);
        }

        /* Gradient Definitions */
        .gradient-sky {
            background: linear-gradient(90deg,
                #1a1a2e 0%,      /* Night */
                #ff6b9d 15%,     /* Dawn pink */
                #ffa07a 25%,     /* Dawn orange */
                #87ceeb 40%,     /* Day sky blue */
                #87ceeb 60%,     /* Day continues */
                #ff8c42 75%,     /* Sunset orange */
                #c06c84 85%,     /* Sunset pink */
                #1a1a2e 100%     /* Night */
            );
        }

        .gradient-monochrome {
            background: linear-gradient(90deg,
                #2c2c2c 0%,      /* Near black */
                #505050 15%,     /* Dark gray */
                #808080 30%,     /* Medium gray */
                #c0c0c0 45%,     /* Light gray */
                #ffffff 50%,     /* White peak */
                #c0c0c0 55%,     /* Light gray */
                #808080 70%,     /* Medium gray */
                #505050 85%,     /* Dark gray */
                #2c2c2c 100%     /* Near black */
            );
        }

        .gradient-warm-cool {
            background: linear-gradient(90deg,
                #2c3e50 0%,      /* Cool dark */
                #3498db 20%,     /* Cool blue */
                #ffd93d 40%,     /* Warm yellow */
                #ff6b6b 50%,     /* Warm red */
                #ffd93d 60%,     /* Warm yellow */
                #3498db 80%,     /* Cool blue */
                #2c3e50 100%     /* Cool dark */
            );
        }

        .gradient-subtle {
            background: linear-gradient(90deg,
                #f5f5f0 0%,      /* Soft white */
                #e8e8e3 25%,     /* Pale beige */
                #d0d0cb 50%,     /* Subtle gray */
                #e8e8e3 75%,     /* Pale beige */
                #f5f5f0 100%     /* Soft white */
            );
        }

        .gradient-ocean {
            background: linear-gradient(90deg,
                #0a2463 0%,      /* Deep ocean */
                #3e92cc 25%,     /* Ocean blue */
                #7dd3c0 40%,     /* Turquoise */
                #f8aa4b 55%,     /* Sunset orange */
                #ff6542 70%,     /* Warm coral */
                #3e92cc 85%,     /* Ocean blue */
                #0a2463 100%     /* Deep ocean */
            );
        }

        .gradient-nordic {
            background: linear-gradient(90deg,
                #e8ebe9 0%,      /* Pale gray */
                #d4d9d6 20%,     /* Muted gray-green */
                #c9cfc9 40%,     /* Soft gray */
                #f5f5f5 50%,     /* Almost white */
                #c9cfc9 60%,     /* Soft gray */
                #d4d9d6 80%,     /* Muted gray-green */
                #e8ebe9 100%     /* Pale gray */
            );
        }

        @media (min-width: 600px) {
            .gradient-options {
                grid-template-columns: repeat(3, 1fr);
            }

            .gradient-swatch {
                height: 80px;
            }
        }
    </style>

    <script>
        // Ordered east from India (following the sun)
        const offices = [
            { city: "Bangalore", timezone: "Asia/Kolkata", flag: "🇮🇳" },        // UTC+5:30
            { city: "Ho Chi Minh", timezone: "Asia/Ho_Chi_Minh", flag: "🇻🇳" },  // UTC+7
            { city: "Jakarta", timezone: "Asia/Jakarta", flag: "🇮🇩" },          // UTC+7
            { city: "Singapore", timezone: "Asia/Singapore", flag: "🇸🇬" },      // UTC+8
            { city: "Manila", timezone: "Asia/Manila", flag: "🇵🇭" },            // UTC+8
            { city: "San Francisco", timezone: "America/Los_Angeles", flag: "🇺🇸" }, // UTC-8
            { city: "South Dakota", timezone: "America/Denver", flag: "🇺🇸" },   // UTC-7
            { city: "New York", timezone: "America/New_York", flag: "🇺🇸" },     // UTC-5
            { city: "Johannesburg", timezone: "Africa/Johannesburg", flag: "🇿🇦" }, // UTC+2
            { city: "Nairobi", timezone: "Africa/Nairobi", flag: "🇰🇪" }         // UTC+3
        ];

        function getTimePeriod(hour) {
            if (hour >= 5 && hour < 8) {
                return "dawn"; // Light gray
            } else if (hour >= 8 && hour < 12) {
                return "morning"; // White
            } else if (hour >= 12 && hour < 17) {
                return "afternoon"; // Light beige
            } else if (hour >= 17 && hour < 20) {
                return "evening"; // Medium gray
            } else if (hour >= 20 && hour < 22) {
                return "dusk"; // Dark gray
            } else {
                return "night"; // Near black
            }
        }

        function createOfficeCard(office) {
            return `
                <div class="office-card" data-timezone="${office.timezone}">
                    <div class="location-header">
                        <span class="flag">${office.flag}</span>
                        <span class="city-name">${office.city}</span>
                    </div>
                    <div class="time-display" data-time="${office.timezone}">--:--</div>
                </div>
            `;
        }

        function updateClocks() {
            const now = new Date();

            offices.forEach(office => {
                // 24-hour format
                const timeStr = now.toLocaleTimeString('en-US', {
                    timeZone: office.timezone,
                    hour12: false,
                    hour: '2-digit',
                    minute: '2-digit'
                });

                const hour = parseInt(now.toLocaleTimeString('en-US', {
                    timeZone: office.timezone,
                    hour12: false,
                    hour: '2-digit'
                }));

                const period = getTimePeriod(hour);

                // Update time
                document.querySelectorAll(`[data-time="${office.timezone}"]`)
                    .forEach(el => el.textContent = timeStr);

                // Update card background
                document.querySelectorAll(`[data-timezone="${office.timezone}"]`)
                    .forEach(card => {
                        card.className = `office-card ${period}`;
                    });
            });
        }

        function initClocks() {
            const container = document.getElementById('widgetContainer');
            container.innerHTML = offices.map(office => createOfficeCard(office)).join('');
            updateClocks();
            setInterval(updateClocks, 60000);
        }

        // Theme toggle
        const themeToggle = document.getElementById('themeToggle');
        const sunIcon = document.querySelector('.sun-icon');
        const moonIcon = document.querySelector('.moon-icon');

        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcon(savedTheme);

        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';

            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        });

        function updateThemeIcon(theme) {
            if (theme === 'dark') {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'block';
            } else {
                sunIcon.style.display = 'block';
                moonIcon.style.display = 'none';
            }
        }

        document.addEventListener('DOMContentLoaded', initClocks);
    </script>
</body>
</html>
